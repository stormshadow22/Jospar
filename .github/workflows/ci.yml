name: Validate Jospar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npm test
      - run: npm run test:firebase
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
